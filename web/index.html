<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ProspectIQ — Automated B2B agency lead discovery, digital health audits, MX-verified contacts, outreach tracking, and cloud scraping intelligence."
    />
    <title>ProspectIQ — Agency Lead Intelligence</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("prospectiq-theme");
          var theme = saved === "light" || saved === "dark" ? saved : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
