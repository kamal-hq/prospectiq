name: ProspectIQ Auto-Scraper

on:
  schedule:
    # Daily 08:00 UTC: scrapes top 2 enabled target_queue rows (~2 SerpApi credits/day)
    # and keeps Supabase Project #2 active within free-tier limits.
    - cron: "0 8 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode ('live' uses SerpApi/Brave; 'mock' runs safe offline smoke test)"
        type: choice
        default: "live"
        options:
          - live
          - mock
      cities:
        description: "Target cities (JSON array e.g. [\"Houston, TX\", \"Austin, TX\"] or pipe-separated; blank uses target_queue)"
        type: string
        required: false
        default: ""
      niches:
        description: "Target niches (JSON array e.g. [\"Plumbing\", \"HVAC\"] or pipe-separated; blank uses target_queue)"
        type: string
        required: false
        default: ""
      max_results:
        description: "Max leads per city x niche query"
        type: string
        required: false
        default: "10"
      start:
        description: "Google Maps pagination offset (e.g. 0, 20, 40)"
        type: string
        required: false
        default: "0"
      queue_limit:
        description: "Max target_queue rows when running in queue mode"
        type: string
        required: false
        default: "2"
      job_id:
        description: "Optional pre-created prospectiq.scrape_jobs UUID (sent by Vercel UI)"
        type: string
        required: false
        default: ""
      trigger_source:
        description: "Job trigger source label"
        type: choice
        default: "MANUAL_UI"
        options:
          - MANUAL_UI
          - CLI
          - CRON

permissions:
  contents: read

concurrency:
  group: prospectiq-auto-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Run ProspectIQ Engine
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute ProspectIQ Scraper
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          # Shared-apps multi-schema contract: publishable key + Owner Auth JWT ONLY
          # (ZERO service_role secret so sibling `cadence` schema stays strictly RLS-protected)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SCHEMA: ${{ secrets.SUPABASE_SCHEMA || secrets.NEXT_PUBLIC_SUPABASE_SCHEMA || 'prospectiq' }}
          SUPABASE_OWNER_EMAIL: ${{ secrets.SUPABASE_OWNER_EMAIL }}
          SUPABASE_OWNER_PASSWORD: ${{ secrets.SUPABASE_OWNER_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_CITIES: ${{ github.event.inputs.cities }}
          INPUT_NICHES: ${{ github.event.inputs.niches }}
          INPUT_MAX_RESULTS: ${{ github.event.inputs.max_results }}
          INPUT_START: ${{ github.event.inputs.start }}
          INPUT_QUEUE_LIMIT: ${{ github.event.inputs.queue_limit }}
          INPUT_JOB_ID: ${{ github.event.inputs.job_id }}
          INPUT_TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          event = os.getenv("EVENT_NAME", "")
          mode = (os.getenv("INPUT_MODE") or "live").strip().lower()
          cities = (os.getenv("INPUT_CITIES") or "").strip()
          niches = (os.getenv("INPUT_NICHES") or "").strip()
          max_results = (os.getenv("INPUT_MAX_RESULTS") or "10").strip()
          start = (os.getenv("INPUT_START") or "0").strip()
          queue_limit = (os.getenv("INPUT_QUEUE_LIMIT") or "2").strip()
          job_id = (os.getenv("INPUT_JOB_ID") or "").strip()
          trigger = (os.getenv("INPUT_TRIGGER_SOURCE") or "").strip()

          cmd = [sys.executable, "main.py"]

          if event == "schedule":
              cmd.extend([
                  "--live",
                  "--queue",
                  "--queue-limit", "2",
                  "--trigger-source", "CRON",
              ])
          else:
              if mode == "live":
                  cmd.append("--live")
              cmd.extend(["--trigger-source", trigger or "MANUAL_UI"])
              cmd.extend(["--max-results", max_results])
              cmd.extend(["--start", start])

              if cities or niches:
                  if cities:
                      cmd.extend(["--cities", cities])
                  if niches:
                      cmd.extend(["--niches", niches])
              elif mode == "live":
                  cmd.extend(["--queue", "--queue-limit", queue_limit])

              if job_id:
                  cmd.extend(["--job-id", job_id])

          print("Launching:", " ".join(cmd), flush=True)
          raise SystemExit(subprocess.call(cmd))
          PY
